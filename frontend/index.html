<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Локальный ассистент</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%237c9cff'/><circle cx='11' cy='14' r='2.5' fill='%23171717'/><circle cx='21' cy='14' r='2.5' fill='%23171717'/><rect x='10' y='20' width='12' height='2.5' rx='1.2' fill='%23171717'/></svg>">
  <!-- Все библиотеки лежат локально в vendor/ — интерфейс работает без интернета -->
  <link rel="stylesheet" href="vendor/highlight-github-dark.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="layout">
    <!-- ===== Боковая панель: список диалогов ===== -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="brand">
          <span class="brand-logo" aria-hidden="true"></span>
          <span>Ассистент</span>
        </div>
        <button class="btn btn-new" id="new-chat-btn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          Новый чат
        </button>
      </div>
      <nav class="conv-list" id="conv-list" aria-label="Диалоги"></nav>
      <div class="sidebar-footer">
        <div class="conn-status" id="conn-status">
          <span class="dot"></span><span class="conn-text">Проверяю Ollama…</span>
        </div>
      </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <!-- ===== Основная область: чат ===== -->
    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-label="Открыть список диалогов">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>

        <label class="model-picker">
          <span class="visually-hidden">Модель</span>
          <select id="model-select" aria-label="Модель"></select>
        </label>

        <label class="toggle" id="think-toggle-wrap" title="Модель сначала рассуждает, потом отвечает. Точнее на сложных задачах, но медленнее.">
          <input type="checkbox" id="think-toggle">
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
          <span class="toggle-label">Размышлять</span>
        </label>

        <div class="vram" id="vram-indicator" title="Сколько модели загружено в видеопамять">
          <span class="dot"></span><span class="vram-text">—</span>
        </div>
      </header>

      <div class="banner" id="banner" hidden></div>

      <section class="messages" id="messages" aria-live="polite">
        <div class="empty" id="empty-state">
          <h1>Чем помочь?</h1>
          <p>Всё работает на вашем компьютере — данные никуда не уходят.</p>
          <div class="suggestions">
            <button type="button" class="suggestion">Объясни, как работает async/await в JavaScript</button>
            <button type="button" class="suggestion">Составь план подготовки к экзамену по алгоритмам на неделю</button>
            <button type="button" class="suggestion">Найди ошибку: <code>for (var i = 0; i &lt; 3; i++) setTimeout(() =&gt; console.log(i))</code></button>
            <button type="button" class="suggestion">Помоги сформулировать письмо преподавателю о переносе дедлайна</button>
          </div>
        </div>
      </section>

      <form class="composer" id="composer">
        <div class="composer-box">
          <textarea id="input" rows="1" placeholder="Напишите сообщение…" aria-label="Сообщение"></textarea>
          <button class="send-btn" id="send-btn" type="submit" aria-label="Отправить" disabled>
            <svg class="icon-send" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            <svg class="icon-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>
          </button>
        </div>
        <p class="composer-hint">Enter — отправить · Shift+Enter — новая строка</p>
      </form>
    </main>
  </div>

  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="vendor/highlight.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
